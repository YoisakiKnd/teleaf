[package]
name = "teleaf"
version = "0.1.6"
edition = "2024"
description = "A lightweight Telegram terminal client with inline media and mouse controls"
repository = "https://github.com/YoisakiKnd/teleaf"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
libloading = "0.8.9"
serde_json = "1.0.151"
base64 = "0.22.1"
directories = "6.0.0"
getrandom = "0.2.17"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Time", "Win32_System_DataExchange", "Win32_System_Memory"] }
image = { version = "0.25.10", default-features = false, features = ["bmp"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["bmp"] }
